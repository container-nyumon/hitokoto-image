# 題材のイメージ ghcr.io/container-nyumon/hitokoto を作って公開する（手動で実行）
name: publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版（1.0 や 1.1）"
        required: true
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt && pytest -q
  publish:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ inputs.version }}
          tags: ghcr.io/${{ github.repository_owner }}/hitokoto:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ひとこと掲示板（Kubernetes 入門の題材）
